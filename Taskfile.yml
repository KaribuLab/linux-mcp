version: "3"

vars:
  APP: linux-mcp
  BIN_DIR: dist
  PKG: ./cmd/linux-mcp
  # Local issuance socket; tmp/ is excluded from air's watcher.
  SOCKET: ./tmp/issue.sock
  # Por defecto la versión sale de git. El pipeline la fija con la del tag:
  # VERSION=v1.2.3 task build:all
  VERSION:
    sh: echo "${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
  VERSION_PKG: github.com/KaribuLab/linux-mcp/internal/command.version

# Solo Linux: la emisión de tokens usa SO_PEERCRED y /proc, que no existen en
# otros sistemas operativos.
includes:
  linux_amd64:
    taskfile: ./taskfiles/linux_amd64.yml
  linux_arm64:
    taskfile: ./taskfiles/linux_arm64.yml

tasks:
  default:
    desc: Lista tareas disponibles
    cmds:
      - task --list

  dev:
    desc: Servidor con recarga (air), socket local en tmp/
    cmds:
      - mkdir -p tmp
      - go tool air

  token:
    desc: Genera un token contra el servidor local (usa TTL=1h para acortarlo)
    vars:
      TTL: '{{.TTL | default "8h"}}'
    cmds:
      - go run {{.PKG}} auth --socket {{.SOCKET}} --ttl {{.TTL}}

  build:
    desc: Build para la arquitectura del host
    cmds:
      - task: "linux_{{ARCH}}:build"

  build:all:
    desc: Build para linux/amd64 y linux/arm64
    deps:
      - linux_amd64:build
      - linux_arm64:build

  clean:
    desc: Elimina binarios generados
    cmds:
      - rm -rf {{.BIN_DIR}}

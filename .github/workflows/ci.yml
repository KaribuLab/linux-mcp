name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Build, análisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe necesita el historial y las tags para la versión.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Tests
        run: go test -race ./...

      # Shellcheck POSIX sobre el instalador one-liner. -s sh es obligatorio:
      # fuerza a shellcheck a evaluar como POSIX y atrapa bashisms ([[ ]],
      # local, arrays, pipefail, ${var,,}, etc.) que romperían el script en
      # hosts donde /bin/sh es dash o ash.
      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint del instalador con shellcheck (POSIX)
        run: shellcheck -s sh install.sh

      # Chequeos de sintaxis contra las dos implementaciones de /bin/sh más
      # comunes en servers Linux: dash (Debian/Ubuntu) y busybox ash (Alpine).
      # Esto complementa a shellcheck y detecta cualquier caso donde el script
      # use una extensión que shellcheck no marque pero el shell real sí rechace.
      - name: Instalar dash y busybox-static
        run: sudo apt-get install -y dash busybox-static

      - name: Sintaxis con dash
        run: dash -n install.sh

      - name: Sintaxis con busybox sh
        run: busybox sh -n install.sh

      # Defensa-en-profundidad sobre shellcheck: greps explícitos de patrones
      # comunes de bash que rompen en dash/ash. Sale con código 1 y muestra
      # línea y patrón si encuentra algún match.
      - name: Scan de bashisms comunes
        run: ./.github/scripts/scan-bashisms.sh install.sh

      # systemd-analyze exige que ExecStart exista, así que el binario se
      # instala en la ruta que declara la unit antes de validarla.
      - name: Instalar el binario en la ruta de la unit
        run: |
          go build -o linux-mcp ./cmd/linux-mcp
          sudo install -m 0755 linux-mcp /usr/local/bin/linux-mcp

      - name: Validar la unit de systemd
        run: systemd-analyze verify deploy/systemd/linux-mcp.service

      - name: Compilar binarios linux/amd64 y linux/arm64
        run: go tool task build:all

      - name: Publicar los binarios del run
        uses: actions/upload-artifact@v7
        with:
          name: linux-mcp-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Tag + Release en el mismo run: un push de tag con GITHUB_TOKEN no
  # dispara otro workflow (anti-loop de GitHub).
  release:
    name: Versionar y publicar Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Descargar kli
        run: |
          curl -fsSL https://github.com/KaribuLab/kli/releases/download/v0.4.2/kli-linux-amd64.tar.gz -o kli.tar.gz
          tar -xzf kli.tar.gz
          mv kli-linux-amd64 kli
          chmod +x kli

      - name: Calcular versión
        id: semver
        run: |
          VERSION=$(./kli semver 2>&1 | tail -n1)
          LATEST_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "version=$VERSION"
          echo "latest_git_tag=$LATEST_GIT_TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$LATEST_GIT_TAG" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar git
        if: steps.semver.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Crear tags con kli
        if: steps.semver.outputs.should_release == 'true'
        run: ./kli semver -t -v

      - uses: actions/setup-go@v7
        if: steps.semver.outputs.should_release == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Compilar con la versión del tag
        if: steps.semver.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: go tool task build:all

      - name: Comprobar que el binario reporta la versión
        if: steps.semver.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.semver.outputs.version }}
        run: |
          reported=$(./dist/linux-mcp-linux-amd64 --version)
          echo "$reported"
          test "$reported" = "linux-mcp version $TAG"

      - name: Generar checksums y publicar Release
        if: steps.semver.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.semver.outputs.version }}
        run: |
          cd dist
          sha256sum linux-mcp-* > SHA256SUMS
          gh release create "$TAG" linux-mcp-* SHA256SUMS --generate-notes --verify-tag

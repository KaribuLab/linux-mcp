name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publicar binarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Tests
        run: go test ./...

      - name: Compilar con la versión del tag
        env:
          VERSION: ${{ github.ref_name }}
        run: go tool task build:all

      - name: Comprobar que el binario reporta la versión del tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          reported=$(./dist/linux-mcp-linux-amd64 --version)
          echo "$reported"
          test "$reported" = "linux-mcp version $TAG"

      - name: Generar checksums
        working-directory: dist
        run: sha256sum linux-mcp-* > SHA256SUMS

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes --verify-tag

version: "3"

tasks:
  build:
    desc: Build linux/arm64
    vars:
      # Se resuelve al ejecutar la task, para que VERSION se pueda sobreescribir
      # desde la línea de comandos.
      LDFLAGS: -s -w -X {{.VERSION_PKG}}={{.VERSION}}
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.APP}}-linux-arm64 {{.PKG}}

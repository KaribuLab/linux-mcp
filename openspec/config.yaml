schema: spec-driven

# Contexto del proyecto (se muestra a la IA al crear artefactos).
context: |
  Proyecto: linux-mcp (github.com/KaribuLab/linux-mcp)
  Qué es: servidor MCP que expone tools de sistema de archivos Linux a clientes
  (Claude, Codex, OpenCode, MCP Inspector, etc.) vía Model Context Protocol.

  Stack:
  - Lenguaje: Go 1.26+
  - SDK MCP: github.com/modelcontextprotocol/go-sdk (Streamable HTTP)
  - Entrypoint: cmd/linux-mcp → internal/handler.NewHandler
  - Tools: internal/tool (registro con mcp.AddTool)
  - Puerto por defecto: localhost:5000
  - CORS: requerido para MCP Inspector (browser)
  - Dev: Air (go tool air), Task (Taskfile.yml + taskfiles/{os}_{arch}.yml)
  - Licencia: Apache 2.0
  - Specs: OpenSpec schema spec-driven (opsx explore/propose/apply/archive)
  - Grafo de código: graphify-out/ (actualizar con `graphify update .`)

  Arquitectura:
  - main → NewHandler → mcp.Server + tools + StreamableHTTPHandler + withCORS
  - Cada tool vive en internal/tool/<nombre>.go con Add*Tool + handler tipado
  - Documentación de tools: docs/tools/<nombre>.md (índice en docs/README.md)

  Convenciones:
  - Commits: Conventional Commits con prefijos feat/fix/chore/refactor; mensaje en español neutro
  - Tools nuevas: implementación + registro en NewHandler + doc en docs/tools/ + fila en docs/README.md
  - No inventar tools sin documentar; la doc es parte del Definition of Done
  - Cada docs/tools/<nombre>.md DEBE incluir sección "## Prompt de ejemplo (agente)"
    con al menos un prompt en español neutro que un humano pueda pegar a un agente para
    ejercitar esa tool vía linux-mcp (forma sugerida: "Usa el tool linux-mcp `<nombre>` para …").

# Reglas por artefacto.
rules:
  proposal:
    - Describir impacto en tools MCP existentes o nuevas
    - Si se añade o cambia una tool, listar la ruta docs/tools/<nombre>.md que se creará o actualizará
    - Incluir sección "Non-goals" cuando ayude a acotar alcance
  design:
    - Detallar firma de tools (nombre MCP, args JSON, forma de respuesta)
    - Explicar registro en NewHandler y transporte (Streamable HTTP / CORS si aplica)
    - Referenciar docs/tools/ como fuente de verdad de comportamiento público
    - 'Fijar el contrato de la sección estándar "Prompt de ejemplo (agente)" en cada docs/tools/<nombre>.md del change'
  specs:
    - Requisitos de tools deben ser verificables contra docs/tools/ y el código en internal/tool
    - 'Si el change añade o modifica docs de una tool, el spec DEBE exigir la sección "Prompt de ejemplo (agente)" con al menos un prompt usable'
  tasks:
    - Toda task que añada o modifique una tool MCP debe incluir subtarea explícita de documentarla en docs/tools/<nombre>.md y actualizar docs/README.md
    - 'Toda task de documentación de tool debe incluir subtarea de sección "## Prompt de ejemplo (agente)" con prompt(s) en español neutro (ej. "Usa el tool linux-mcp `ps` para …")'
    - Toda task que añada o modifique un comando de CLI debe incluir subtarea explícita de documentarlo en docs/commands/<nombre>.md (flags, defaults, salida y códigos de error) y actualizar docs/README.md
    - No marcar complete una tool ni un comando sin documentación alineada al comportamiento real del código
    - Preferir chunks de trabajo acotados (ideal ≤ 2 horas)
